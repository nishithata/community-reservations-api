# Render Blueprint: one-click deploy of the API.
# Dashboard -> New -> Blueprint -> select this repository.
#
# PostgreSQL is hosted on Neon (free tier, no expiry). Set DATABASE_URL in the
# Render dashboard to Neon's *direct* (non-pooled) connection string. See
# docs/DEPLOYMENT.md for using a Render-managed database instead.
services:
  - type: web
    name: community-reservations-api
    runtime: ruby
    plan: free
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: RAILS_ENV
        value: production
      # Single Puma process with threads fits the free instance's memory.
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "5"
      - key: SEED_DEMO_DATA
        value: "true"
      # Set these in the Render dashboard; they are never committed.
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
