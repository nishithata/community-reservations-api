# Render Blueprint: one-click deploy of the API and its PostgreSQL database.
# Dashboard -> New -> Blueprint -> select this repository.
databases:
  - name: community-reservations-db
    plan: free
    databaseName: community_reservations
    user: community_reservations

services:
  - type: web
    name: community-reservations-api
    runtime: ruby
    plan: free
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: community-reservations-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: RAILS_ENV
        value: production
      # Single Puma process with threads fits the free instance's memory.
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "5"
      - key: SEED_DEMO_DATA
        value: "true"
      # Set these two in the Render dashboard; they are never committed.
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
